<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif;
    background:radial-gradient(900px 500px at 88% -10%,rgba(34,211,238,.35),transparent 60%),
               radial-gradient(900px 520px at 0% 15%,rgba(99,102,241,.45),transparent 55%),#0b1020;
    color:#eaf0ff;position:relative}
  .grid{position:absolute;inset:0;opacity:.4;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
  .wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
  .tag{font-family:'JetBrains Mono',monospace;font-size:22px;color:#8ee7f5;letter-spacing:.04em;margin-bottom:26px;
    display:inline-flex;gap:12px;align-items:center;width:max-content;
    background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);padding:12px 20px;border-radius:999px}
  .dot{width:12px;height:12px;border-radius:50%;background:#34d399}
  h1{font-size:96px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .role{font-family:'JetBrains Mono',monospace;font-size:34px;color:#8ee7f5;font-weight:600;margin-top:22px}
  .role b{color:#5566a8;font-weight:600;margin:0 8px}
  .foot{margin-top:44px;font-size:26px;color:#c7d0e6;display:flex;gap:26px;align-items:center}
  .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:10px 20px;border-radius:999px;font-size:23px;font-weight:600}
  .url{position:absolute;bottom:56px;right:80px;font-family:'JetBrains Mono',monospace;color:#9fb0e0;font-size:24px}
</style></head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="tag"><span class="dot"></span> Available now · London, UK</div>
    <h1>Meghana BV</h1>
    <div class="role">Senior Data Engineer <b>·</b> SQL <b>·</b> ETL <b>·</b> Data Migration</div>
    <div class="foot">
      <span class="pill">7+ yrs experience</span>
      <span class="pill">SAP · Syniti · dbt · AWS</span>
      <span class="pill">Full UK right to work</span>
    </div>
  </div>
  <div class="url">meghanabv19.github.io</div>
</body></html>
